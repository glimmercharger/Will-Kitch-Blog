<link id="fa-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css">

<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col">
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
            <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%}
          {% if site.author.email -%}
            <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

    <div class="footer-commit" id="footer-commit" data-owner="glimmercharger" data-repo="Will-Kitch-Blog">
      <a
        class="commit-link"
        href="https://github.com/glimmercharger/Will-Kitch-Blog/commits/main"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="commit-icon" aria-hidden="true"><i class="fa-brands fa-github"></i></span>
        <span class="commit-text">Latest commit</span>
        <span class="commit-hash">(latest)</span>
      </a>
    </div>
  </div>
</footer>

<script>
  (function () {
    var root = document.getElementById("footer-commit");
    if (!root) return;

    var owner = root.getAttribute("data-owner");
    var repo = root.getAttribute("data-repo");
    var link = root.querySelector(".commit-link");
    var text = root.querySelector(".commit-text");
    var hash = root.querySelector(".commit-hash");

    if (!owner || !repo || !link || !text || !hash) return;

    fetch("https://api.github.com/repos/" + owner + "/" + repo + "/commits?per_page=1")
      .then(function (res) {
        if (!res.ok) throw new Error("GitHub API request failed");
        return res.json();
      })
      .then(function (commits) {
        if (!Array.isArray(commits) || commits.length === 0) return;

        var latest = commits[0];
        if (!latest.sha || !latest.html_url) return;

        link.href = latest.html_url;
        if (latest.commit && latest.commit.message) {
          var message = latest.commit.message.split("\n")[0].trim();
          if (message) text.textContent = message;
        }
        hash.textContent = "(" + latest.sha.slice(0, 7) + ")";
      })
      .catch(function () {
        // Keep fallback link and text when API is unavailable.
      });
  })();
</script>
